# django_booking_system/docker-compose.yml
version: '3.8'

services:
  db:
    image: postgres:16
    volumes:
      - postgres_data:/var/lib/pgsql/data  # исправил путь на рекомендованный
    environment:
      POSTGRES_DB: meeting_rooms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: yourpassword
    ports:
      - "5432:5432"

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - .env  # ← указываем путь к файлу, а не ключи напрямую!
    depends_on:
      - db

volumes:
  postgres_data: