services:
  db:
    image: postgres:16
    volumes:
      - postgres_data:/var/lib/postgresql/data 
    env_file:
      - .env
    ports:
      - "5432:5432"

  web:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - web

volumes:
  postgres_data: